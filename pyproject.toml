[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "carevoice-ai"
version = "0.1.0"
description = "Privacy-first clinical documentation assistant foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "cryptography>=50,<51",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "structlog>=24.4,<26",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
audio = [
    "faster-whisper>=1.1,<2",
]
dev = [
    "mypy>=1.13,<2",
    "pip-audit>=2.7,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["carevoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["carevoice"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["carevoice"]
plugins = ["pydantic.mypy"]
