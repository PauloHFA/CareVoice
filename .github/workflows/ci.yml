name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev,audio]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy carevoice
      - name: Tests and coverage
        run: pytest --cov=carevoice --cov-report=term-missing
      - name: Audit dependencies
        run: |
          python -m pip install --upgrade "setuptools>=84.1.0"
          pip-audit --skip-editable
